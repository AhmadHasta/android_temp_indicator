name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Upload Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APKs (Universal & Split ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Rename APKs for Release
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk battery-temperature-monitor-${{ github.ref_name }}-universal.apk
          cp app-arm64-v8a-release.apk battery-temperature-monitor-${{ github.ref_name }}-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk battery-temperature-monitor-${{ github.ref_name }}-armeabi-v7a.apk
          cp app-x86_64-release.apk battery-temperature-monitor-${{ github.ref_name }}-x86_64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/battery-temperature-monitor-${{ github.ref_name }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/battery-temperature-monitor-${{ github.ref_name }}-universal.apk
            build/app/outputs/flutter-apk/battery-temperature-monitor-${{ github.ref_name }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/battery-temperature-monitor-${{ github.ref_name }}-x86_64.apk
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
